# ============================================================
# CD Pipeline — Deploy to Production Server
# Triggered manually or on push to main branch
# ============================================================

name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.gitignore'
      - '.env.example'

env:
  DOCKER_IMAGE: threat-intel-platform
  DEPLOY_PATH: /opt/threat-intel

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ env.DEPLOY_PATH }}

            # Pull latest code
            git pull origin main

            # Update .env with secrets from GitHub
            echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > .env
            echo "ABUSEIPDB_API_KEY=${{ secrets.ABUSEIPDB_API_KEY }}" >> .env
            echo "OTX_API_KEY=${{ secrets.OTX_API_KEY }}" >> .env
            echo "NEO4J_PASSWORD=${{ secrets.NEO4J_PASSWORD }}" >> .env
            echo "NEO4J_URI=bolt://neo4j:7687" >> .env
            echo "NEO4J_USER=neo4j" >> .env
            echo "WAZUH_ALERTS_PATH=/app/data/wazuh_logs/alerts.json" >> .env

            # Pull new image
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull

            # Backup current data
            ./deploy.sh --no-cache

            # Clean up old images
            docker image prune -f