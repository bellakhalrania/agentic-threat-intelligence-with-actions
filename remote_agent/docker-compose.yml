# remote_agent/docker-compose.yml
#
# Docker Compose for the Remote Response Agent (Machine 2).
# Run this on the target/endpoint machine that receives and executes
# response scripts from the Threat Intelligence Platform (Machine 1).
#
# Usage:
#   docker-compose -f remote_agent/docker-compose.yml up -d
#
# For production, set REMOTE_AGENT_API_KEY in a .env file or environment.

version: '3.8'

services:
  remote-response-agent:
    build:
      context: ..
      dockerfile: remote_agent/Dockerfile
    container_name: remote-response-agent
    ports:
      - "9001:9001"
    environment:
      - REMOTE_AGENT_HOST=0.0.0.0
      - REMOTE_AGENT_PORT=9001
      - REMOTE_AGENT_API_KEY=${REMOTE_AGENT_API_KEY:-change-me-in-production}
      - REMOTE_AGENT_HMAC_SECRET=${REMOTE_AGENT_HMAC_SECRET:-}
      - REMOTE_AGENT_REPLAY_WINDOW=300
      - REMOTE_AGENT_TIMEOUT=1800
    volumes:
      - remote_agent_scripts:/app/remote_agent/received_scripts
      - remote_agent_logs:/app/remote_agent/logs
    # Capabilities needed for iptables/nftables operations
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    restart: unless-stopped

volumes:
  remote_agent_scripts:
  remote_agent_logs: