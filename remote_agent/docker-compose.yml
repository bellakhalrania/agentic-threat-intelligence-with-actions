# remote_agent/docker-compose.yml
#
# Docker Compose for the Remote Response Agent (Machine 2).
# Run this on the target/endpoint machine that receives and executes
# response scripts from the Threat Intelligence Platform (Machine 1).
#
# Usage:
#   cd remote_agent && docker compose up -d --build
#
# For production, set REMOTE_AGENT_API_KEY in a .env file or environment.

services:
  remote-response-agent:
    build:
      # Keep this deployable as a standalone directory on Machine 2.
      context: .
      dockerfile: Dockerfile
    container_name: remote-response-agent
    network_mode: host
    environment:
      - REMOTE_AGENT_HOST=0.0.0.0
      - REMOTE_AGENT_PORT=9001
      - REMOTE_AGENT_API_KEY=${REMOTE_AGENT_API_KEY}
      - REMOTE_AGENT_HMAC_SECRET=${REMOTE_AGENT_HMAC_SECRET}
      - REMOTE_AGENT_REPLAY_WINDOW=300
      - REMOTE_AGENT_TIMEOUT=1800
      - REMOTE_RESULT_WEBHOOK_ENABLED=${REMOTE_RESULT_WEBHOOK_ENABLED:-false}
      - REMOTE_RESULT_WEBHOOK_URL=${REMOTE_RESULT_WEBHOOK_URL:-}
      - REMOTE_WEBHOOK_KEY=${REMOTE_WEBHOOK_KEY:-}
      - REMOTE_RESULT_WEBHOOK_TIMEOUT=${REMOTE_RESULT_WEBHOOK_TIMEOUT:-10}
      - REMOTE_RESULT_WEBHOOK_RETRIES=${REMOTE_RESULT_WEBHOOK_RETRIES:-3}
      - REMOTE_RESULT_WEBHOOK_BACKOFF=${REMOTE_RESULT_WEBHOOK_BACKOFF:-1.0}
      - REMOTE_RESULT_WEBHOOK_VERIFY_SSL=${REMOTE_RESULT_WEBHOOK_VERIFY_SSL:-true}
      - REMOTE_AGENT_NODE_IP=${REMOTE_AGENT_NODE_IP:-}
      - REMOTE_MANAGER_IP=${REMOTE_MANAGER_IP:?REMOTE_MANAGER_IP is required}
    volumes:
      - remote_agent_scripts:/app/remote_agent/received_scripts
      - remote_agent_logs:/app/remote_agent/logs
    # Capabilities needed for iptables/nftables operations
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    restart: unless-stopped

  remote-event-forwarder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: remote-event-forwarder
    network_mode: host
    command: ["python", "-m", "remote_agent.forwarder"]
    environment:
      - AGENT_SOURCE_URL=${AGENT_SOURCE_URL}
      - AGENT_SOURCE_API_KEY=${AGENT_SOURCE_API_KEY:-}
      - AGENT_SOURCE_VERIFY_SSL=${AGENT_SOURCE_VERIFY_SSL:-true}
      - AGENT_EVENTS_PATH=/app/remote_agent/spool/agent_events.jsonl
      - AGENT_CURSOR_PATH=/app/remote_agent/spool/agent_cursor.json
      - AGENT_FORWARD_BATCH_SIZE=${AGENT_FORWARD_BATCH_SIZE:-100}
      - AGENT_FORWARD_POLL_INTERVAL=${AGENT_FORWARD_POLL_INTERVAL:-15}
      - AGENT_FORWARD_TIMEOUT=${AGENT_FORWARD_TIMEOUT:-30}
      - AGENT_FORWARD_MAX_RETRIES=${AGENT_FORWARD_MAX_RETRIES:-3}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - remote_agent_spool:/app/remote_agent/spool
    restart: unless-stopped

  remote-ssh-collector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: remote-ssh-collector
    network_mode: host
    command: ["python", "-m", "remote_agent.ssh_collector"]
    environment:
      - SSH_COLLECTOR_SPOOL=/app/remote_agent/spool/agent_events.jsonl
      - SSH_COLLECTOR_POLL_INTERVAL=2
      - SSH_COLLECTOR_HOST=${REMOTE_AGENT_NODE_HOSTNAME:?REMOTE_AGENT_NODE_HOSTNAME is required}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - remote_agent_spool:/app/remote_agent/spool
      - /run/log/journal:/run/log/journal:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    restart: unless-stopped

volumes:
  remote_agent_scripts:
  remote_agent_logs:
  remote_agent_spool:
